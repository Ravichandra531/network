# Listen on localhost (Mac 1 itself) and the Wi-Fi IP (other Macs)
listen-address=127.0.0.1,10.7.11.188
bind-interfaces

# Don't read /etc/resolv.conf; forward normal names (google.com) upstream
no-resolv
server=8.8.8.8

# Our private zone: answer it ourselves, never forward it
local=/TEAM.test/
host-record=app.TEAM.test,10.7.3.111
host-record=api.TEAM.test,10.7.3.111

domain-needed
bogus-priv
log-queries

