# ==========================================
# STEP 4: Initial HTTP Configuration
# ==========================================
upstream team_backends {
    server 10.7.21.172:3001 max_fails=1 fail_timeout=10s;   # Backend A
    server 10.7.1.203:3002 max_fails=1 fail_timeout=10s;   # Backend B
}

server {
    listen 8080 default_server;
    server_name app.team1.test api.team1.test;

    location / {
        proxy_pass http://team_backends;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        add_header X-Upstream-Addr $upstream_addr always;
    }
}


# ==========================================
# STEP 6: Final HTTPS Configuration
# ==========================================
# (Note: upstream block is identical to above, but included for completeness)
upstream team_backends {
    server 10.7.21.172:3001 max_fails=1 fail_timeout=10s;   # Backend A
    server 10.7.1.203:3002 max_fails=1 fail_timeout=10s;   # Backend B
}

# Plain HTTP now only redirects to HTTPS
server {
    listen 8080 default_server;
    server_name app.team1.test api.team1.test;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name app.team1.test api.team1.test;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/app.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://team_backends;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        add_header X-Upstream-Addr $upstream_addr always;
    }
}
